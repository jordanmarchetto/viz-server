services:
  viz-server:
    build: .
    container_name: viz-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      VIZ_TOKEN: "${VIZ_TOKEN}"
      DATA_DIR: /data
      PAGE_TTL_DAYS: "${PAGE_TTL_DAYS:-30}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
